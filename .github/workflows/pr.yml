name: PR

on:
  pull_request:

jobs:
  pr:
    runs-on: ubuntu-26.04
    steps:
    - name: Checkout the repository
      uses: actions/checkout@v7

    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: 26
        cache: npm

    - run: npm install
    - run: npm test
    - run: npm run lint
    - run: npm run build
