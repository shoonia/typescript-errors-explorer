name: Build & Deploy

on:
  push:
    branches:
      - master

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
    - name: Checkout the repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 24
        cache: npm

    - run: npm install
    - run: npm test
    - run: npm run lint
    - run: npm run build

    - name: Upload Pages artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
    - name: Download Pages artifact
      uses: actions/download-artifact@v4
      with:
        name: github-pages
        path: ./dist-artifact

    - name: Extract artifact
      run: |
        mkdir -p ./dist
        tar -xf ./dist-artifact/artifact.tar -C ./dist

    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./dist
